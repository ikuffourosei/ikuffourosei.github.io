<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Navy Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#001a33"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#99ccff" stroke-width="8" opacity="0.4"/>
  
  <!-- Initials Text (EKO) -->
  <text x="50%" y="54%" 
        font-family="'Roboto Slab', 'Montserrat', Georgia, serif" 
        font-size="210" 
        font-weight="700" 
        fill="#99ccff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="4">EKO</text>
</svg>
